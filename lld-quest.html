<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLD Quest — learn low-level design step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F6FB; --panel:#FFFFFF; --panel2:#E8EFF8; --ink:#14305C; --text:#1C2B44; --muted:#56698A;
  --line:rgba(20,48,92,.10); --rule:rgba(20,48,92,.28);
  --accent:#E09E00; --accent-soft:rgba(224,158,0,.16); --accent-ink:#3B2A00;
  --ok:#1C8556; --ok-soft:rgba(28,133,86,.12); --bad:#C0392B; --bad-soft:rgba(192,57,43,.10);
  --code:#0F2747; --code-text:#DCE7F5;
  --display:"Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C2140; --panel:#11305A; --panel2:#163a6a; --ink:#E7EFFA; --text:#DCE6F4; --muted:#9DB1CD;
    --line:rgba(231,239,250,.07); --rule:rgba(231,239,250,.25);
    --accent:#FFC53D; --accent-soft:rgba(255,197,61,.16); --accent-ink:#2A1E00;
    --ok:#4ADE9A; --ok-soft:rgba(74,222,154,.12); --bad:#FF8A70; --bad-soft:rgba(255,138,112,.12);
    --code:#071629; --code-text:#DCE7F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C2140; --panel:#11305A; --panel2:#163a6a; --ink:#E7EFFA; --text:#DCE6F4; --muted:#9DB1CD;
  --line:rgba(231,239,250,.07); --rule:rgba(231,239,250,.25);
  --accent:#FFC53D; --accent-soft:rgba(255,197,61,.16); --accent-ink:#2A1E00;
  --ok:#4ADE9A; --ok-soft:rgba(74,222,154,.12); --bad:#FF8A70; --bad-soft:rgba(255,138,112,.12);
  --code:#071629; --code-text:#DCE7F5;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{
  margin:0; font-family:var(--body); color:var(--text); background-color:var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:24px 24px; line-height:1.55; font-size:16px; min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);color:var(--ink);line-height:1.15;margin:0}
code,pre{font-family:var(--mono)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--ink)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);background:none;border:0;padding:0;letter-spacing:.5px}
.brand span{display:inline-block;border:2px solid var(--ink);padding:0 6px;margin-right:6px}
.rank{flex:1;min-width:200px;display:flex;align-items:center;gap:10px}
.rank-name{font-family:var(--display);font-weight:600;color:var(--ink);white-space:nowrap}
.xpbar{flex:1;height:12px;border:2px solid var(--ink);background:var(--panel2);position:relative;min-width:90px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .5s ease}
.xpnum{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px}
.chip{border:2px solid var(--ink);padding:2px 10px;font-weight:600;font-size:14px;background:var(--panel);white-space:nowrap}
.chip.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{max-width:1080px;margin:0 auto;padding:28px 18px 80px}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;margin-bottom:44px}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:-.5px}
.hero p{font-size:18px;color:var(--muted);max-width:56ch;margin:14px 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:600;font-family:var(--display);font-size:16px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.amber{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.prompt-card{border:2px dashed var(--rule);background:var(--panel);padding:18px 20px;font-family:var(--mono);font-size:14px;color:var(--text)}
.prompt-card .who{color:var(--muted);display:block;margin-bottom:6px}
.prompt-card .type{color:var(--ink);font-weight:500}
.caret{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-h h2{font-size:26px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}

/* mission map as UML classes */
.map{display:flex;flex-direction:column;align-items:stretch;margin-bottom:52px}
.uml-wrap{display:flex;flex-direction:column;align-items:center}
.uml-wrap:nth-child(odd){align-items:flex-start}
.uml-wrap:nth-child(even){align-items:flex-end}
.link{height:34px;border-left:2px dashed var(--rule);margin:0 auto}
.uml{width:min(520px,100%);background:var(--panel);border:2px solid var(--ink);text-align:left;padding:0;display:block;position:relative}
.uml:not(:disabled):hover{box-shadow:6px 6px 0 var(--accent);transform:translate(-3px,-3px)}
.uml:disabled{cursor:not-allowed}
.uml.locked{opacity:.55;border-style:dashed}
.uml-head{padding:10px 14px;border-bottom:2px solid var(--ink);text-align:center}
.stereo{font-family:var(--mono);font-size:13px;color:var(--muted);display:block}
.uml-head b{font-family:var(--display);font-size:22px;color:var(--ink)}
.uml-sec{padding:8px 14px;font-family:var(--mono);font-size:13.5px;border-bottom:1px solid var(--rule);color:var(--text)}
.uml-sec:last-child{border-bottom:0;display:flex;justify-content:space-between;align-items:center}
.uml-sec div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-size:18px;letter-spacing:2px;color:var(--accent)}
.stars .off{color:var(--rule)}
.tagline{font-family:var(--body);color:var(--muted);font-size:14px;white-space:normal!important}

/* playbook */
.playbook{list-style:none;margin:0 0 52px;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;border:2px solid var(--ink);background:var(--panel)}
.playbook li{counter-increment:s;padding:16px 16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);position:relative}
.playbook li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);line-height:1}
.playbook h3{font-size:18px;margin:6px 0 4px}
.playbook p{margin:0;font-size:14.5px;color:var(--text)}
.playbook .min{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.badge{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);background:var(--panel);padding:12px}
.badge .ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--accent);background:var(--accent-soft);flex:none}
.badge.off{border-style:dashed;opacity:.5}
.badge.off .ic{filter:grayscale(1);border-color:var(--rule);background:transparent}
.badge b{display:block;font-family:var(--display);color:var(--ink)}
.badge small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:0}

/* mission view */
.m-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.back{background:none;border:2px solid var(--ink);padding:6px 12px;font-weight:600}
.m-top h1{font-size:clamp(24px,3.4vw,34px)}
.m-prompt{font-family:var(--mono);font-size:14px;color:var(--muted);margin:0 0 18px}
.rail-scroll{overflow-x:auto;margin-bottom:20px;padding-bottom:4px}
.rail{display:flex;min-width:640px;list-style:none;margin:0;padding:0}
.rail li{flex:1;position:relative;text-align:center;font-size:12.5px;color:var(--muted);padding-top:34px}
.rail li::before{content:"";position:absolute;top:13px;left:0;right:0;height:2px;background:var(--rule)}
.rail li:first-child::before{left:50%}
.rail li:last-child::before{right:50%}
.rail .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border:2px solid var(--rule);background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);z-index:1}
.rail li.done .dot{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rail li.done.perfect .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rail li.now .dot{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 4px var(--accent-soft)}
.rail li.now{color:var(--ink);font-weight:600}

.stage{background:var(--panel);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--panel2)}
.stage-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.stage-h h2{font-size:22px}
.xp-tag{font-family:var(--mono);font-size:13px;border:2px solid var(--accent);padding:2px 8px;color:var(--ink);background:var(--accent-soft)}
.stage-b{padding:20px}
.concept{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;margin-bottom:18px;max-width:78ch}
.concept b{font-family:var(--display);color:var(--ink)}
.concept p{margin:4px 0 0}
.q{font-size:18px;font-weight:600;color:var(--ink);margin:0 0 14px;max-width:70ch}
.hint{border:2px dashed var(--rule);padding:10px 14px;margin:0 0 14px;font-size:15px;max-width:78ch}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.opt{border:2px solid var(--rule);background:var(--paper);padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:52px}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--ink);margin-top:2px;display:grid;place-items:center;font-size:13px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--panel2)}
.opt[aria-pressed="true"] .box{background:var(--ink);color:var(--paper)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.opt.locked{cursor:default}

.cls{display:flex;flex-direction:column;gap:10px}
.cls-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:2px solid var(--rule);background:var(--paper);padding:10px 12px;flex-wrap:wrap}
.cls-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.cls-row.bad{border-color:var(--bad);background:var(--bad-soft)}
.cls-row .t{font-weight:500;flex:1;min-width:200px}
.cls-row .fix{display:block;font-size:13px;color:var(--bad);font-weight:600}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{border:0;border-right:2px solid var(--ink);background:var(--panel);padding:6px 12px;font-size:14px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.ord{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ord h3{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600;margin-bottom:8px}
.pool,.seq{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:10px;border:2px dashed var(--rule)}
.seq{counter-reset:o;border-style:solid;border-color:var(--ink);background:var(--paper)}
.tile{border:2px solid var(--ink);background:var(--panel);padding:8px 12px;text-align:left;font-size:15px}
.seq .tile{counter-increment:o;display:flex;gap:10px}
.seq .tile::before{content:counter(o);font-family:var(--display);font-weight:700;color:var(--accent)}
.tile.ok{border-color:var(--ok);background:var(--ok-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.empty{color:var(--muted);font-size:14px;padding:8px}

.qz{display:flex;flex-direction:column;gap:22px}
.qz-item p{margin:0 0 8px;font-weight:600;color:var(--ink);max-width:72ch}
.qz-item .opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.qz-item .opt .box{border-radius:50%}
.qz-why{margin:8px 0 0;font-size:14.5px;color:var(--text);border-left:3px solid var(--rule);padding-left:10px;max-width:78ch}

pre.code{background:var(--code);color:var(--code-text);padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;margin:0 0 16px;border:2px solid var(--ink)}
.code .kw{color:#FFC53D}
.code .cm{color:#7FA3CF;font-style:italic}
.code .ty{color:#7EE0B5}
.notes{margin:0;padding-left:20px;max-width:78ch}
.notes li{margin-bottom:6px}

.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.actions .sp{flex:1}
.msg{color:var(--bad);font-weight:600;font-size:14px}
.fb{margin-top:18px;border:2px solid var(--ink);padding:14px 16px;display:flex;gap:14px;align-items:flex-start;max-width:820px}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.mid{border-color:var(--accent);background:var(--accent-soft)}
.fb.low{border-color:var(--bad);background:var(--bad-soft)}
.fb .big{font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink);white-space:nowrap}
.fb p{margin:0}
.fb .ttl{font-weight:700;color:var(--ink)}

/* finish */
.finish{background:var(--panel);border:2px solid var(--ink);padding:34px 24px;text-align:center;box-shadow:8px 8px 0 var(--accent)}
.finish h1{font-size:clamp(28px,4vw,40px)}
.finish .stars{font-size:46px;margin:14px 0}
.finish .row{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:10px 0 22px}
.finish .row div{font-family:var(--mono);color:var(--muted);font-size:14px}
.finish .row b{display:block;font-family:var(--display);font-size:28px;color:var(--ink)}
.finish .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.new-badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 22px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--paper);padding:12px 18px;border:2px solid var(--accent);font-weight:600;z-index:20;transition:transform .35s ease;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
.fade{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .uml-wrap:nth-child(odd),.uml-wrap:nth-child(even){align-items:center}
  .ord{grid-template-columns:1fr}
  .stage-b{padding:16px}
  .rank{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .confetti{display:none}
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="brand" id="home-btn" aria-label="LLD Quest home"><span>LLD</span>Quest</button>
  <div class="rank">
    <span class="rank-name" id="rank-name">Intern</span>
    <div class="xpbar" role="progressbar" aria-label="Progress to next rank" id="xpbar"><i id="xpfill" style="width:0"></i></div>
    <span class="xpnum" id="xpnum">0 XP</span>
  </div>
  <div class="chips">
    <span class="chip" id="streak" title="Perfect stages in a row. At 3+ you earn a 20% combo bonus.">🔥 0</span>
    <span class="chip" id="badgecount" title="Badges earned">🏅 0</span>
  </div>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------ */
/*  CONTENT                                                            */
/* ------------------------------------------------------------------ */
const STEPS = [
  {n:"Clarify", min:"5 min", d:"Ask questions until the vague prompt has edges: scale, actors, variations, what is out of scope. Interviewers grade this step heavily."},
  {n:"Requirements", min:"3 min", d:"Write down functional requirements (what the system does) and non-functional ones (consistency, extensibility, performance). This becomes your checklist."},
  {n:"Entities", min:"5 min", d:"Underline the nouns in your requirements. Real things with state and behaviour become classes; adjectives become enums or fields; verbs become methods."},
  {n:"Relationships & flow", min:"7 min", d:"Connect the classes: is-a (inheritance), has-a (composition), uses (dependency). Trace one core flow end to end so the diagram is proven, not guessed."},
  {n:"Patterns & SOLID", min:"5 min", d:"Look for the parts that vary or grow. Wrap them behind interfaces and pick a pattern only when it removes a real if-else chain or coupling."},
  {n:"Edge cases & concurrency", min:"5 min", d:"Two users at once, partial failures, rounding, timeouts. Say how you lock, validate and recover. This is where senior signals show up."},
  {n:"Code", min:"15 min", d:"Write the skeleton: enums, interfaces, core classes, and the one method that runs the main flow. Readable names beat clever code."}
];

const LEVELS = [
  [0,"Intern"],[150,"Junior Dev"],[350,"SDE-1"],[600,"SDE-2"],[900,"Senior Engineer"],[1200,"Staff Engineer"],[1500,"Architect"]
];

const BADGES = [
  {id:"first", ic:"🚀", n:"First commit", d:"Clear your first stage."},
  {id:"clarify", ic:"❓", n:"Question everything", d:"Perfect score on any Clarify stage."},
  {id:"nohint", ic:"🧠", n:"No hints needed", d:"Finish a mission without opening a hint."},
  {id:"streak5", ic:"🔥", n:"On a roll", d:"Five perfect stages in a row."},
  {id:"pattern", ic:"🧩", n:"Pattern spotter", d:"Perfect Patterns stage in three missions."},
  {id:"race", ic:"🔒", n:"Race condition hunter", d:"Perfect edge-case stage in BookMyShow."},
  {id:"flawless", ic:"⭐", n:"Flawless design", d:"Earn three stars on a mission."},
  {id:"architect", ic:"🏛️", n:"Architect", d:"Finish all five missions."}
];

const FN_NF = ["Functional","Non-functional"];
const REL = ["Is-a","Has-a","Uses"];

const MISSIONS = [
/* =================== 1. PARKING LOT =================== */
{
 id:"parking", title:"Parking Lot", level:"Easy", patterns:"Strategy, Singleton",
 tagline:"The classic warm-up. Learn the full flow on a system everyone understands.",
 prompt:"Design a parking lot system.",
 stages:[
 {type:"multi", xp:40,
  learn:"A one-line prompt hides a dozen decisions. Good clarifying questions change your design; bad ones are about visuals, vendors or infrastructure, which belong to UI or high-level design.",
  q:"Which questions are worth asking the interviewer? Select all that apply.",
  hint:"Ask yourself: would the answer change which classes or methods I write?",
  options:[
   {t:"Does the lot have multiple floors?", ok:true, why:"Decides whether you need a Floor class between ParkingLot and ParkingSpot."},
   {t:"Which vehicle types and spot sizes exist?", ok:true, why:"Drives the Vehicle hierarchy and the spot-fitting rule."},
   {t:"How is the fee calculated: hourly, flat, or by vehicle type?", ok:true, why:"Tells you pricing varies, which hints at a Strategy."},
   {t:"Are there multiple entry and exit gates?", ok:true, why:"Multiple gates means concurrent spot assignment, so you need locking."},
   {t:"What colour should the printed ticket be?", ok:false, why:"Visual detail; no class or method changes."},
   {t:"Should we use MySQL or MongoDB?", ok:false, why:"Storage choice is high-level design. In LLD you model objects first."},
   {t:"Do some spots have EV charging?", ok:true, why:"Good extension question: shows you plan for new spot types."}
  ]},

 {type:"code", xp:30,
  learn:"Write the skeleton in this order: enums, abstract classes, interfaces, then the orchestrating class with the main flow.",
  q:"Read the skeleton and the walkthrough, then claim your XP.",
  code:`enum VehicleType { BIKE, CAR, TRUCK }
enum SpotSize { SMALL, MEDIUM, LARGE }

abstract class Vehicle { String plate; VehicleType type; }
class Car extends Vehicle { }
class Bike extends Vehicle { }

class ParkingSpot {
    String id; SpotSize size; Vehicle parked;
    boolean isFree() { return parked == null; }
}

class Floor {
    int number; List<ParkingSpot> spots;
    // synchronized: two gates can't take the same spot
    synchronized ParkingSpot assign(Vehicle v) {
        for (ParkingSpot s : spots)
            if (s.isFree() && fits(s, v)) { s.parked = v; return s; }
        return null;
    }
}

interface PricingStrategy { double fee(Ticket t, LocalDateTime exit); }
class HourlyPricing implements PricingStrategy { /* rate * hours */ }

class Ticket { String id; Vehicle vehicle; ParkingSpot spot; LocalDateTime entry; }

class ParkingLot {
    private static final ParkingLot INSTANCE = new ParkingLot();
    List<Floor> floors; PricingStrategy pricing;

    Ticket park(Vehicle v) {
        for (Floor f : floors) {
            ParkingSpot s = f.assign(v);
            if (s != null) return new Ticket(v, s, LocalDateTime.now());
        }
        throw new LotFullException();
    }
    double unpark(Ticket t) {
        double amount = pricing.fee(t, LocalDateTime.now());
        t.spot.parked = null;   // free the spot
        return amount;
    }
}`,
  notes:["Flow: EntryGate calls park(), which walks floors and asks each to assign() a spot atomically.","unpark() delegates the fee to the injected PricingStrategy, so new pricing never touches ParkingLot.","Next upgrade: replace the linear scan with a free-spot queue per size for O(1) assignment."]}

  q:"Read the skeleton and claim your XP.",
  code:`enum Coin { ONE(1), FIVE(5), TEN(10), TWENTY(20); final int value; }

interface State {
    void insertMoney(VendingMachine m, int amount);
    void selectProduct(VendingMachine m, String code);
    void cancel(VendingMachine m);
}

class IdleState implements State {
    public void insertMoney(VendingMachine m, int amt) {
        m.balance += amt;
        m.setState(new HasMoneyState());
    }
    public void selectProduct(VendingMachine m, String c) { throw new IllegalStateException("Insert money first"); }
    public void cancel(VendingMachine m) { /* nothing to refund */ }
}

class HasMoneyState implements State {
    public void insertMoney(VendingMachine m, int amt) { m.balance += amt; }
    public void selectProduct(VendingMachine m, String code) {
        Product p = m.inventory.get(code);
        if (p == null || m.inventory.qty(code) == 0) throw new SoldOutException();
        if (m.balance < p.price) throw new InsufficientFundsException();
        if (!m.changer.canReturn(m.balance - p.price)) { cancel(m); return; }
        m.setState(new DispenseState(code));
        m.dispense();
    }
    public void cancel(VendingMachine m) { m.refundAll(); m.setState(new IdleState()); }
}

class VendingMachine {
    State state = new IdleState();
    Inventory inventory; ChangeDispenser changer; int balance;
    void setState(State s) { this.state = s; }
    void insertMoney(int amt)   { state.insertMoney(this, amt); }
    void selectProduct(String c){ state.selectProduct(this, c); }
    void cancel()               { state.cancel(this); }
}`,

  code:`enum SplitType { EQUAL, EXACT, PERCENT }

abstract class Split {
    User user; long amountPaise;
    abstract boolean validate(Expense e);
}
class EqualSplit extends Split { boolean validate(Expense e) { return true; } }
class PercentSplit extends Split {
    double percent;
    boolean validate(Expense e) { /* all percents sum to 100 */ return true; }
}

class Expense {
    String id; User paidBy; long amountPaise;
    List<Split> splits; SplitType type;
}

class SplitFactory {
    static List<Split> create(SplitType t, long total, List<User> users, List<Double> values) {
        switch (t) {
            case EQUAL:   return equal(total, users);   // remainder goes to first user
            case EXACT:   return exact(users, values);
            case PERCENT: return percent(total, users, values);
        }
        throw new IllegalArgumentException();
    }
}

class BalanceSheet {
    // balances.get(a).get(b) > 0 means b owes a
    Map<User, Map<User, Long>> balances = new HashMap<>();
}

class ExpenseService {
    BalanceSheet sheet; List<ExpenseListener> listeners;

    synchronized void addExpense(Expense e) {
        for (Split s : e.splits) if (!s.validate(e)) throw new InvalidSplitException();
        for (Split s : e.splits) {
            if (s.user == e.paidBy) continue;
            sheet.add(e.paidBy, s.user, s.amountPaise);   // updates both directions
        }
        listeners.forEach(l -> l.onExpenseAdded(e));
    }
}`,
  notes:["Amounts are long paise, so no floating-point drift.","Validation lives in each Split; the service stays generic.","Debt simplification is a separate class that reads BalanceSheet and greedily matches biggest creditor with biggest debtor."]}

  code:`enum Direction { UP, DOWN, IDLE }
enum CarState { IDLE, MOVING, DOORS_OPEN, MAINTENANCE }

class Request { int floor; Direction dir; }

class ElevatorCar {
    int id, currentFloor; Direction dir = Direction.IDLE; CarState state = CarState.IDLE;
    PriorityQueue<Integer> upStops = new PriorityQueue<>();
    PriorityQueue<Integer> downStops = new PriorityQueue<>(Comparator.reverseOrder());
    List<FloorListener> listeners = new ArrayList<>();

    synchronized void addStop(int floor) {
        if (floor > currentFloor) upStops.add(floor); else downStops.add(floor);
    }
    void step() {                       // called on each tick
        Integer next = (dir != Direction.DOWN) ? upStops.peek() : downStops.peek();
        if (next == null) { reverseOrIdle(); return; }
        currentFloor += Integer.compare(next, currentFloor);
        listeners.forEach(l -> l.onFloor(id, currentFloor));
        if (currentFloor == next) { pollStop(); openDoors(); }
    }
}

interface DispatchStrategy { ElevatorCar pick(List<ElevatorCar> cars, Request r); }
class NearestCarStrategy implements DispatchStrategy {
    public ElevatorCar pick(List<ElevatorCar> cars, Request r) {

function hl(src){
  const KW = /\b(public|private|protected|static|final|class|interface|enum|extends|implements|new|return|if|else|for|throw|synchronized|void|boolean|int|long|double|switch|case|null|this|continue|true|false)\b/g;
  const TY = /\b(List|Map|HashMap|ArrayList|PriorityQueue|ConcurrentHashMap|LocalDateTime|Duration|String|Comparator|Integer)\b/g;
  return src.split("\n").map(line=>{
    let code = line, cm = "";
    const ci = line.indexOf("//"), bi = line.indexOf("/*");
    const cut = [ci,bi].filter(x=>x>=0).sort((a,b)=>a-b)[0];
    if(cut !== undefined){ code = line.slice(0,cut); cm = line.slice(cut); }
    const kwOnly = new RegExp("^"+KW.source+"$");
    code = esc(code).replace(new RegExp(KW.source+"|"+TY.source,"g"), w =>
      kwOnly.test(w) ? `<span class="kw">${w}</span>` : `<span class="ty">${w}</span>`);
    return code + (cm ? `<span class="cm">${esc(cm)}</span>` : "");
  }).join("\n");
}

    if(Object.keys(R.ans).length < st.items.length){ msg.textContent = "Sort every item before checking."; return; }
    let c=0;
    st.items.forEach((it,k)=>{
      const row = b.querySelector(`[data-row="${k}"]`), good = R.ans[k]===it.b;
      if(good) c++;
      row.classList.add(good?"ok":"bad");
      if(!good){ const f=row.querySelector(".fix"); f.hidden=false; f.textContent = "Answer: " + st.buckets[it.b]; }
      row.querySelectorAll("button").forEach(x=>x.disabled=true);
    });
    score = c/st.items.length;
  }
  if(st.type==="order"){
    if(R.ans.length < st.items.length){ msg.textContent = "Place every step before checking."; return; }
    let c=0; R.checked = true;
    b.innerHTML = orderHTML(st);
    b.querySelectorAll(".seq .tile").forEach((el,pos)=>{ const good = R.ans[pos]===pos; if(good) c++; el.classList.add(good?"ok":"bad"); });
    score = c/st.items.length;
    if(score<1){
      b.insertAdjacentHTML("beforeend", `<div class="concept" style="margin-top:16px"><b>Correct order</b><ol style="margin:6px 0 0;padding-left:20px">${st.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></div>`);
    }
  }
  if(st.type==="quiz"){
    if(Object.keys(R.ans).length < st.qs.length){ msg.textContent = "Answer every question before checking."; return; }
    let c=0;
    st.qs.forEach((q,qi)=>{
      if(R.ans[qi]===q.a) c++;
      b.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(el=>{
        const oi = +el.dataset.o; el.classList.add("locked");
        if(oi===q.a) el.classList.add(R.ans[qi]===q.a ? "ok" : "miss");
        else if(oi===R.ans[qi]) el.classList.add("bad");
      });
      b.querySelector(`.qz-item[data-q="${qi}"] .qz-why`).hidden = false;
    });
    score = c/st.qs.length;
  }
  R.checked = true;

  // XP
  const perfect = score === 1;
  if(st.type !== "code"){ if(perfect){ S.streak++; S.bestStreak = Math.max(S.bestStreak,S.streak); } else S.streak = 0; }
  const combo = S.streak >= 3 && perfect;
  let gain = Math.round(st.xp * score * (combo ? 1.2 : 1)) - (R.hint ? 5 : 0);
  gain = Math.max(0, gain);
  const prev = S.best[R.m.id][R.si] || 0;
  const credited = Math.max(0, gain - prev);
  S.best[R.m.id][R.si] = Math.max(prev, gain);
  S.xp += credited; R.earned += gain; R.scores[R.si] = score;

  // badges
  award("first");
  if(R.si===0 && perfect) award("clarify");
  if(S.streak >= 5) award("streak5");
  if(R.si===4 && perfect && !S.patternPerfect.includes(R.m.id)){ S.patternPerfect.push(R.m.id); if(S.patternPerfect.length>=3) award("pattern"); }
  if(R.si===5 && perfect && R.m.id==="bms") award("race");
  save(); renderBar();

  const pct = Math.round(score*100);
  const cls = st.type==="code" ? "good" : perfect ? "good" : score >= .6 ? "mid" : "low";
  const title = st.type==="code" ? "Skeleton reviewed." : perfect ? (combo ? "Perfect. Combo bonus applied." : "Perfect.") : score >= .6 ? "Close. Review the highlighted answers." : "Worth another look. Read the explanations below each answer.";
  const xpLine = credited < gain ? `+${gain} XP (only +${credited} new, since you beat this before)` : `+${gain} XP`;
  $("#fb").innerHTML = `<div class="fb ${cls} fade" role="status"><span class="big">${st.type==="code" ? "✓" : pct+"%"}</span><div><p class="ttl">${title}</p><p>${xpLine}${R.hint?" · hint used (−5)":""}</p></div></div>`;
  actions(st);
}

/* ------------------------------------------------------------------ */
/*  FINISH                                                             */
/* ------------------------------------------------------------------ */
function finish(){
  const m = R.m;
  const scored = R.scores.slice(0,6);
  const pct = Math.round(scored.reduce((a,b)=>a+b,0)/scored.length*100);
  const stars = pct>=90 ? 3 : pct>=70 ? 2 : 1;
  const prev = S.done[m.id];
  S.done[m.id] = {stars: Math.max(stars, prev ? prev.stars : 0), pct: Math.max(pct, prev ? prev.pct : 0)};
  if(R.hintsUsed===0) award("nohint");
  if(stars===3) award("flawless");
  if(MISSIONS.every(x=>S.done[x.id])) award("architect");
  save(); renderBar();
  const mi = R.mi, nextI = mi+1 < MISSIONS.length ? mi+1 : null;
  const weak = scored.map((s,k)=>[s,k]).filter(([s])=>s<1).map(([,k])=>STEPS[k].n);
  app.innerHTML = `<section class="finish fade">
    <h1>${esc(m.title)} designed.</h1>
    <div class="stars" aria-label="${stars} of 3 stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
    <div class="row">
      <div><b>${pct}%</b>accuracy</div>
      <div><b>+${R.earned}</b>XP this run</div>
      <div><b>${levelInfo(S.xp).name}</b>current rank</div>
    </div>
    ${weak.length ? `<p style="max-width:60ch;margin:0 auto 20px;color:var(--muted)">To improve: revisit ${weak.join(", ")}. Replays only award XP when you beat your best score on a stage.</p>` : `<p style="margin:0 0 20px;color:var(--muted)">Every step perfect. That's an interview-ready walkthrough.</p>`}
    ${R.newBadges.length ? `<div class="new-badges">${R.newBadges.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="badge"><span class="ic">${b.ic}</span><div><b>${b.n}</b><small>${b.d}</small></div></div>`;}).join("")}</div>` : ""}
    <div class="acts">
      ${nextI!==null ? `<button class="btn amber" id="nx">Next mission: ${esc(MISSIONS[nextI].title)}</button>` : ""}
      <button class="btn ghost" id="rp">Replay this mission</button>
      <button class="btn ghost" id="hm">Back to missions</button>
    </div>
  </section>`;
  nextI!==null && $("#nx").addEventListener("click",()=>start(nextI));
  $("#rp").addEventListener("click",()=>start(mi));
  $("#hm").addEventListener("click",home);
  R = null;
  confetti();
  window.scrollTo(0,0);
}

function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#FFC53D","#E09E00","#4ADE9A","#7FA3CF","#14305C","#FF8A70"];
  for(let i=0;i<70;i++){
    const d = document.createElement("div"); d.className="confetti";
    d.style.left = Math.random()*100+"vw";
    d.style.background = colors[i%colors.length];
    d.style.animationDuration = (1.8+Math.random()*1.8)+"s";
    d.style.animationDelay = (Math.random()*.5)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(), 4500);
  }
}

$("#home-btn").addEventListener("click", ()=>{ if(!R || R.si===0 || confirm("Leave this mission? XP already earned is kept.")) home(); });
home();
</script>
